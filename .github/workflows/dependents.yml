name: Dependents

# The dependents check (#59, #208, #252): builds and tests the CLI's branch matching this line against this tree; a TEXT-DIFF line is a row pending re-record at the pin, never a failure. The pin lane runs it before its PR and before the tag.
# Dispatched by the captain (`gh workflow run "Dependents" --ref beta|main`), once
# before a tag and when a reading asks; never on a push run (the owner's word of
# 2026-10-27, through the stack keeper: a push runs the required set alone).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  dependents:
    name: dependents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/dependents-target
          key: ubuntu-dependents-${{ hashFiles('Cargo.toml', 'docs/DEPENDENTS.md') }}
          restore-keys: |
            ubuntu-dependents-

      - name: Build and test the dependents against this tree
        run: tools/dependents-check.sh --ci
        env:
          DEPENDENTS_TARGET_DIR: ${{ runner.temp }}/dependents-target

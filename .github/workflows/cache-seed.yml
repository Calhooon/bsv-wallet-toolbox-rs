name: Cache seed

# Why this file exists (#642): beta lands through GitHub's merge queue, and a
# merge_group run restores caches only from its own ref and the default branch.
# The default branch is main, and nothing on main saves the Test Suite's caches,
# so every queue run built cold. This workflow lives on main (the scope a queue
# run reads), runs on a push to main and on dispatch, checks out beta and builds
# the two Test Suite feature sets under rust-cache with beta's exact keys, so
# the save lands under main's scope. A queue run restores it exactly while
# beta's lock and the stable toolchain stand where the seed found them, and by
# prefix (rust-cache's fallback: the key minus the lock hash, which the CLI's
# queue runs showed as `full match: false` on a still mostly warm target/) once
# the lock has moved; a stable release or a change to beta's keyed inputs leaves
# the queue cold until the next dispatch. Beta's ci.yml saves no cache on
# merge_group (its save-if names push alone), so the queue's own refs never
# fill the store, and this seed is the only writer under main's scope for
# these keys.
#
# What it mirrors: beta's .github/workflows/ci.yml, jobs `test` (Test Suite)
# and `test-remote` (Test Suite (remote only)). rust-cache's key is its prefix,
# the shared key, the runner OS and arch, a hash of `rustc -vV` and of every
# CARGO*, CC*, CFLAGS*, CXX*, CMAKE*, RUST* environment variable set when its
# step runs, and a hash of the workspace manifests, Cargo.lock and any
# .cargo/config.toml or rust-toolchain file. So a change on beta to any of these
# must be mirrored here the same day, or the seed saves a key no queue run asks
# for: the workflow `env:` block; the `runs-on`; the checkout and `Install
# Rust` steps (the dtolnay/rust-toolchain sha and its `toolchain:`, since that
# action exports CARGO_* variables); the `Resolve the dependency lock` step;
# the `Cache the dependency build` step (the rust-cache sha and `shared-key`,
# or any `key`, `env-vars`, `prefix-key`, `cache-targets` input added there);
# and the build steps (`Build unit tests (sqlite)` and `Build integration
# tests` in `test`, `Build unit and integration tests (remote only)` in
# `test-remote`), which fill target/. No test runs here.
#
# Each job asks before the build whether main's scope already holds the exact key
# (`lookup-only`); on a hit it skips the build, so a needless run costs seconds
# and a lock or toolchain change costs one build. Two jobs in parallel, one per
# feature set, as beta's: two slots at most, each with its own target/, so
# neither save carries the other feature set's artifacts.
on:
  # A push to main renews the seed when main moves; a dispatch by hand renews
  # it after a stable release or a change to beta's keyed inputs (the lookup
  # makes a needless dispatch cost seconds). No schedule: the owner's word on
  # idle jobs, and the CLI's #486 shape, the keeper's reading of 2026-11-03.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One seed at a time; a running seed is never cancelled (its save is the point).
concurrency:
  group: cache-seed
  cancel-in-progress: false

# Beta's ci.yml workflow env, byte for byte: rust-cache hashes the CARGO* and
# RUST* variables into its key.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  # Beta's `test` job (Test Suite): the `sqlite,remote` builds.
  seed-test:
    name: Seed Test Suite cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: beta

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Resolve the dependency lock
        run: test -f Cargo.lock || cargo generate-lockfile

      # The exact key under main's scope already: nothing to build.
      - name: Look up the seed
        id: lookup
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-sqlite-remote
          lookup-only: true
          save-if: false

      - name: Cache the dependency build
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-sqlite-remote

      - name: Build unit tests (sqlite)
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: cargo test --no-run --lib --features sqlite,remote

      - name: Build integration tests
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: cargo test --no-run --test '*' --features sqlite,remote,bench-support

  # Beta's `test-remote` job (Test Suite (remote only)): the `remote` build.
  seed-test-remote:
    name: Seed Test Suite (remote only) cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: beta

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Resolve the dependency lock
        run: test -f Cargo.lock || cargo generate-lockfile

      - name: Look up the seed
        id: lookup
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-remote
          lookup-only: true
          save-if: false

      - name: Cache the dependency build
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-remote

      - name: Build unit and integration tests (remote only)
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: cargo test --no-run --lib --tests --no-default-features --features remote

  # Beta's `lint` job: the two stable Clippy runs and the ratchet's clippy run
  # on 1.98.1. Both toolchains are installed in beta's order before the cache
  # step: rust-cache hashes `rustc -vV` of every installed toolchain, so a
  # stable-only seed saves a key no lint job asks for, and stable installed last
  # stays the default toolchain the Clippy runs use.
  seed-lint:
    name: Seed lint cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: beta

      - name: Install Rust (the ratchet's toolchain)
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.98.1"
          components: clippy

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Resolve the dependency lock
        run: test -f Cargo.lock || cargo generate-lockfile

      - name: Look up the seed
        id: lookup
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          lookup-only: true
          save-if: false

      - name: Cache the dependency build
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint

      - name: Clippy
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: cargo clippy --all-targets --features sqlite,remote -- -D warnings

      - name: Clippy (remote only)
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: cargo clippy --no-default-features --features remote -- -D warnings

      # tools/ratchet has no build-only form (it measures, writes or checks), so
      # this is its clippy command as the tool runs it (clippy_diagnostics and
      # cargo_env): RUSTFLAGS and CARGO_ENCODED_RUSTFLAGS removed, colour off,
      # on 1.98.1.
      - name: The ratchet's clippy run
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        env:
          RUSTUP_TOOLCHAIN: "1.98.1"
          CARGO_TERM_COLOR: never
        run: |
          unset RUSTFLAGS CARGO_ENCODED_RUSTFLAGS
          cargo clippy --all-targets --message-format=json -- -W clippy::pedantic -A clippy::all -W clippy::cognitive_complexity -W missing_docs > /dev/null

  # Beta's `checks` job: the `sqlite` test builds behind its vector, word-table
  # and fixture gates, and the documentation build.
  seed-checks:
    name: Seed checks cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: beta

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Prepare dependency lock
        run: |
          if ! test -f Cargo.lock; then
            cargo generate-lockfile
          fi

      - name: Look up the seed
        id: lookup
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks
          lookup-only: true
          save-if: false

      - name: Cache the dependency build
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks

      - name: Build the vector tests
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: cargo test --features sqlite --test arcade_status_vector_tests --test arc_broadcast_body_tests --test test_vectors --no-run

      - name: Build the unit tests (the word table)
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: cargo test --features sqlite --lib --no-run

      - name: Build the fixtures
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: cargo test --test fixtures --locked --no-run

      - name: Documentation
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: cargo doc --no-deps --features sqlite
        env:
          RUSTDOCFLAGS: -Dwarnings

  # Beta's `semver` job: cargo-semver-checks' rustdoc builds of the tree and a
  # git baseline. The baseline here is beta's own tip by sha, the check against
  # itself (no break to report), which builds both sides as beta's job does.
  seed-semver:
    name: Seed semver cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: beta
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Resolve the dependency lock
        run: test -f Cargo.lock || cargo generate-lockfile

      - name: Look up the seed
        id: lookup
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: semver
          lookup-only: true
          save-if: false

      - name: Cache the dependency build
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: semver

      - name: Install cargo-semver-checks
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-semver-checks

      - name: Build the tree and its baseline
        if: ${{ steps.lookup.outputs.cache-hit != 'true' }}
        run: cargo semver-checks --baseline-rev "$(git rev-parse HEAD)" --release-type minor --color never

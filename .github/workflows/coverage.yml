name: Coverage

# Line coverage of the library tests through cargo-llvm-cov, uploaded to Codecov; a floor is the captain's reading, not this job's gate.
# Dispatched by the captain (`gh workflow run "Coverage" --ref beta|main`), once
# before a tag and when a reading asks; never on a push run (the owner's word of
# 2026-10-27, through the stack keeper: a push runs the required set alone).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-coverage-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ubuntu-coverage-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: cargo llvm-cov --lib --features sqlite --lcov --output-path lcov.info
        env:
          # Two replays for a ladder scene a runner stall failed (#513); one locally.
          LADDER_FIXTURES_STALL_REPLAYS: "2"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: lcov.info
          fail_ci_if_error: false

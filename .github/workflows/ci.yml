name: CI

# The machine gate. Two branches are protected, `main` (the stable line) and
# `beta` (the programme's line, RELEASING.md). The set of jobs a pull request
# runs is exactly the set branch protection requires (the stack keeper's rule
# for every public repository of the stack, the owner's word behind it,
# 2026-10-26): a job that runs on a PR but cannot refuse it is noise, a job that
# could refuse but is not required is a hole. Beta requires five contexts:
# `Test Suite (ubuntu-latest, stable)`, `Test Suite (remote only)`, `lint`,
# `checks`, `semver` (#617 bundled the eleven of #612 into these: `lint` holds
# Rustfmt, locks, Clippy and the ratchet, `checks` the scoreboard, vectors,
# fixtures and Documentation, each as its own step); main requires the six its
# older workflow has until beta merges into it, when its protection moves to
# these five. Renaming one of those jobs removes its context and blocks every
# PR into that branch until the protection is updated. Every action is pinned
# by commit sha.
# The required test and clippy steps build `sqlite,remote`, so the storage client's
# wire witnesses (tests/storage_wire.rs, #202) gate every pull request. The
# integration step and the doc-test step also enable `bench-support` (the four
# #182 witnesses; one library build shared, #253).
# The `Test Suite (remote only)` job builds and runs the unit tests and every
# suite with `remote` alone, so a gate a remote-only host needs cannot go
# missing (#429); it runs beside the Test Suite rather than after it (#612).
#
# The balance (the owner's word of 2026-10-27, through the stack keeper, which
# replaces the 2026-10-26 reading): a push to `main` or `beta` runs exactly the
# required set, the same as a pull request, nothing more. The measurements that
# used to ride the push run (the full matrix of both OSes and the beta toolchain,
# coverage, the door bench, the dependents check) run on `workflow_dispatch` and
# once before a tag, each in its own workflow with its own badge (`matrix.yml`,
# `coverage.yml`, `bench.yml`, `dependents.yml`; `mutants.yml` and `fuzz.yml`
# likewise), never on the push run. A newer push cancels the previous run; a
# cancelled run is never a red. release.yml calls this file on a tag, so a tag
# runs the required set too; the captain dispatches the measurements before it.
#
# The merge queue (#614): beta lands through GitHub's merge queue, which builds
# a temporary commit per queued PR (refs/heads/gh-readonly-queue/beta/pr-<n>-<sha>)
# and waits on the same five contexts for it. Every job runs and reports on
# `merge_group`: a job an `if:` skips there yields no check-run, and the queue
# holds the group pending until its timeout.
#
# The docs-only short-circuit (#632): every job's opening step after its
# checkout runs tools/docs-only, and every step after it carries
# `steps.scope.outputs.docs_only != 'true'` in its `if:`. On a pull request or
# a queue group whose every changed path is a doc (docs/ and every *.md, less
# docs/ARCHITECTURE.md, docs/architecture/ and docs/NORTH-STAR.md, which gates
# read, and a *.md under tests/, fuzz/, test_vectors/, tools/ or .github/), the
# job's remaining steps are skipped and the job concludes success, so its
# required context reports green in seconds. Skipped steps, never a skipped
# job: a job an `if:` skips concludes `skipped`, not `success`, and the merge
# queue paragraph above is why no required job relies on it. A push and a
# tag's call never short-circuit.
on:
  pull_request:
    branches: [main, beta]
    # No `labeled` or `unlabeled`: `gh pr create --label` fired `opened` and
    # `labeled` a second apart, the concurrency group cancelled one of the two
    # runs, and the cancelled run's checks held the merge until it was re-run
    # (#612). The semver job reads the PR's labels live instead, so a label
    # added later reaches it through a plain re-run.
    types: [opened, synchronize, reopened]
  push:
    branches: [main, beta]
  # The merge queue's group commit, one per queued PR (#614).
  merge_group:
    types: [checks_requested]
  # release.yml runs the same jobs on a tag before it publishes.
  workflow_call:

permissions:
  contents: read

# A newer push to the same ref supersedes the run; a tag's run is never cancelled.
# The key names the event and then the queue group's head ref (unique per group,
# so one group never cancels another), the PR's number (one head branch may open
# a PR into each line) or the pushed ref: a PR's push never cancels a queue run
# and a queue run never cancels a PR's.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.merge_group.head_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# The CI build carries no debuginfo and no incremental state (#612): a test
# binary without DWARF compiles and links faster, and incremental artifacts are
# never reused across runs. Environment rather than a `[profile.ci]`, so every
# cargo call takes it, tools/arch-doc-tests.sh's own `cargo test --list` calls
# among them, and lists from the build beside it instead of building the dev
# profile again. On x86_64 Linux the toolchain links with its bundled rust-lld
# by default (Rust 1.90 and later), so RUSTFLAGS names no linker.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The required cell only, on a pull request, a push and a tag alike (the
        # owner's word of 2026-10-27); matrix.yml runs every cell on dispatch.
        os: [ubuntu-latest]
        rust: [stable]
    steps:
      # Two commits deep: on a pull request HEAD is GitHub's merge commit and
      # HEAD^1 its base, the diff the docs-only and affected-tests steps read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # The docs-only short-circuit (#632): tools/docs-only reads the change
      # (a pull request's merge commit against HEAD^1, a queue group against
      # its parent; never a push or a tag's call) and, when every path is in
      # its docs set, every step below is skipped and the job reports success,
      # so the required context still reports. Any other path runs the job's
      # full set. The set and why each exclusion: the script's docstring.
      - name: Docs only
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: python3 tools/docs-only --event "$EVENT" ${BASE:+--base "$BASE"}

      # The tests the PR's changed paths reach (#618; tools/affected-tests
      # holds the map and tools/affected-tests-test its cases): on a pull
      # request the run steps below run those; on a merge-queue group, a push
      # and a tag's call, every test. The builds and the architecture doc
      # tests run on every event either way: a compile error anywhere stays
      # red on the PR, and the queue's run is the whole suite once.
      - name: The affected tests
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        id: affected
        env:
          EVENT: ${{ github.event_name }}
        run: python3 tools/affected-tests --event "$EVENT"

      - name: Install Rust
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ matrix.rust }}

      # Cargo.lock is not tracked (a library): resolve it before the cache, so
      # the cache key hashes the lock this build uses, not the manifest alone.
      - name: Resolve the dependency lock
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: test -f Cargo.lock || cargo generate-lockfile

      # The dependencies' build, keyed by the action on the lock, the rustc
      # release and host, and the CARGO* and RUST* environment (RUSTFLAGS and
      # the profile above among them), plus the feature set's shared key; the
      # workspace crate is pruned before the save. Saved by a push to a line
      # alone (a PR's cache is its own ref's, seen by no other PR; a line's is
      # seen by every PR into it), restored everywhere.
      - name: Cache the dependency build
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-sqlite-remote
          save-if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Install cargo-nextest
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146

      # The builds and the runs are separate steps, so the log shows the job's
      # compile time apart from its test time; nextest's run lists from these
      # builds and compiles nothing.
      - name: Build unit tests (sqlite)
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: cargo test --no-run --lib --features sqlite,remote

      # Every target under tests/, not services_tests alone: the witnesses of
      # the 0.4.x fixes live in the other files.
      # `bench-support` also runs the four network-isolation witnesses of #182.
      - name: Build integration tests
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: cargo test --no-run --test '*' --features sqlite,remote,bench-support

      # A mark lld or mold leaves in the binary's .comment section.
      - name: The linker the build used
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: |
          for f in target/debug/deps/bsv_wallet_toolbox_rs-*; do
            if [ -f "$f" ] && [ -x "$f" ]; then
              readelf -p .comment "$f" | grep -i -E 'lld|mold' || echo "$f: no lld or mold mark"
              break
            fi
          done

      # An empty filter is every test of the run; a run the change does not
      # reach is skipped, and the job still reports. A filtered run may match
      # no test of a feature set (a target whose tests all need `sqlite`, in
      # the remote-only job), which nextest refuses by default: warn instead.
      - name: Run unit tests (sqlite)
        if: ${{ steps.affected.outputs.unit_run == 'true' && steps.scope.outputs.docs_only != 'true' }}
        run: |
          filter=(); [ -z "$FILTER" ] || filter=(-E "$FILTER" --no-tests=warn)
          cargo nextest run --lib --features sqlite,remote --no-fail-fast "${filter[@]}"
        env:
          FILTER: ${{ steps.affected.outputs.unit_filter }}
          # Two replays for a ladder scene a runner stall failed (#513); one locally.
          LADDER_FIXTURES_STALL_REPLAYS: "2"

      - name: Run integration tests
        if: ${{ steps.affected.outputs.tests_run == 'true' && steps.scope.outputs.docs_only != 'true' }}
        run: |
          filter=(); [ -z "$FILTER" ] || filter=(-E "$FILTER" --no-tests=warn)
          cargo nextest run --test '*' --features sqlite,remote,bench-support --no-fail-fast "${filter[@]}"
        env:
          FILTER: ${{ steps.affected.outputs.tests_filter }}

      # Every test the invariants tables of docs/ARCHITECTURE.md name exists
      # (and section 7's D7 row keeps its citations). The `--lib` rows list
      # with the unit-test step's features and the `--test` rows with the
      # integration step's, so cargo lists from the builds above and compiles
      # nothing new (the lane for #312 found CI did not run this script).
      - name: Architecture doc tests
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: ARCH_DOC_LIB_FEATURES=sqlite,remote ARCH_DOC_TEST_FEATURES=sqlite,remote,bench-support bash tools/arch-doc-tests.sh

      # The integration step's feature set, so the library it built is reused
      # here and the job compiles it once less (#253). Doc tests stay on cargo
      # test: nextest does not run them.
      - name: Run doc tests
        if: ${{ steps.affected.outputs.doc_run == 'true' && steps.scope.outputs.docs_only != 'true' }}
        run: cargo test --doc --features sqlite,remote,bench-support

  # The unit tests and every suite under tests/ with `remote` alone: a test
  # needing a SQL store carries its feature gate (#429). The run takes well
  # under a minute past its build, so it runs rather than only builds. Its own
  # job, so its build runs beside the Test Suite's instead of after it (#612).
  test-remote:
    name: Test Suite (remote only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # As the Test Suite's step: the docs-only short-circuit (#632).
      - name: Docs only
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: python3 tools/docs-only --event "$EVENT" ${BASE:+--base "$BASE"}

      # As the Test Suite's step: the affected tests on a pull request.
      - name: The affected tests
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        id: affected
        env:
          EVENT: ${{ github.event_name }}
        run: python3 tools/affected-tests --event "$EVENT"

      - name: Install Rust
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      # Cargo.lock is not tracked (a library): resolve it before the cache, so
      # the cache key hashes the lock this build uses, not the manifest alone.
      - name: Resolve the dependency lock
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: test -f Cargo.lock || cargo generate-lockfile

      # As the Test Suite's cache, keyed for the remote-only feature set.
      - name: Cache the dependency build
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-remote
          save-if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Install cargo-nextest
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146

      - name: Build unit and integration tests (remote only)
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: cargo test --no-run --lib --tests --no-default-features --features remote

      - name: Run unit and integration tests (remote only)
        if: ${{ steps.affected.outputs.remote_run == 'true' && steps.scope.outputs.docs_only != 'true' }}
        run: |
          filter=(); [ -z "$FILTER" ] || filter=(-E "$FILTER" --no-tests=warn)
          cargo nextest run --lib --tests --no-default-features --features remote --no-fail-fast "${filter[@]}"
        env:
          FILTER: ${{ steps.affected.outputs.remote_filter }}
          # Two replays for a ladder scene a runner stall failed (#513); one locally.
          LADDER_FIXTURES_STALL_REPLAYS: "2"

  # The static gates in one job (#617), so a PR run holds one queue slot for
  # them rather than five: Rustfmt, the one-bsv-rs-per-lock rule and the
  # reusable call's grants (the old `locks` job), Clippy with its two feature
  # sets, and the ratchet. Each gate is its own step and runs whether or not a
  # gate before it failed (`!cancelled()`), so one red does not hide another;
  # the last step writes every gate's outcome to the job summary and names each
  # red one in an annotation. No step continues on error: any red gate fails
  # the job. cargo-deny is not run here: deny.toml is the stack's seed and no
  # workflow runs `cargo deny check` yet.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # Two commits deep, as the Test Suite's checkout: the docs-only step's diff.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # As the Test Suite's step: the docs-only short-circuit (#632).
      - name: Docs only
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: python3 tools/docs-only --event "$EVENT" ${BASE:+--base "$BASE"}

      # The ratchet's instrument (below), installed before stable so stable
      # stays the default toolchain for every other gate.
      - name: Install Rust (the ratchet's toolchain)
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.98.1"
          components: clippy

      - name: Install Rust
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Cargo.lock is not tracked (a library): resolve it before the cache, so
      # the cache key hashes the lock this build uses, not the manifest alone.
      - name: Resolve the dependency lock
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: test -f Cargo.lock || cargo generate-lockfile

      # As the Test Suite's cache, keyed for this job's check builds: Clippy's
      # two feature sets on stable and the ratchet's clippy run on 1.98.1.
      - name: Cache the dependency build
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Rustfmt
        id: fmt
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: cargo fmt --all -- --check

      # One bsv-rs per lock (bsv-stack-lean #182): a committed Cargo.lock holding
      # two bsv-rs entries fails, the gate a self-merging stack PR stands behind.
      - name: locks, one bsv-rs per committed Cargo.lock
        id: locks
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: |
          set -euo pipefail
          status=0
          found=0
          while IFS= read -r -d '' lock; do
            found=$((found + 1))
            n=$(grep -c '^name = "bsv-rs"$' "$lock" || true)
            echo "$lock: $n bsv-rs"
            if [ "$n" -gt 1 ]; then
              echo "::error file=$lock::$n bsv-rs entries; one bsv-rs per lock"
              status=1
            fi
          done < <(git ls-files -z -- 'Cargo.lock' '*/Cargo.lock')
          [ "$found" -gt 0 ] || echo "no committed Cargo.lock"
          exit "$status"

      - name: locks, the reusable CI call grants every job's permissions
        id: grants
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: |
          bash tools/workflow-grants-check.sh
          bash tools/workflow-grants-check-test.sh

      # Clippy covers SQL storage with remote, plus remote without default features,
      # each on every target; a target that needs `sqlite` declares it in
      # `required-features`, so the remote-only build skips it (#660).
      - name: Clippy
        id: clippy
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: cargo clippy --all-targets --features sqlite,remote -- -D warnings

      - name: Clippy (remote only)
        id: clippy-remote
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: cargo clippy --all-targets --no-default-features --features remote -- -D warnings

      # The numbers that may only fall (#55): tools/ratchet measures the tree and
      # fails when one rises above tools/ratchet.json. The toolchain is pinned to
      # the one the baseline was measured with (its `rustc` and `toolchain` keys):
      # the numbers depend on the clippy version, so an unpinned toolchain makes
      # the ratchet drift and go red on every stable release; the pin is the
      # measurement's instrument, not a dependency pin. A mismatch fails with
      # "re-record the baseline with toolchain X"; move the pin (the earlier
      # install step above and RUSTUP_TOOLCHAIN here) and the baseline in one PR.
      # The script drops RUSTFLAGS from cargo's environment: it counts warnings,
      # and the workflow's -Dwarnings would stop the build at any one of them.
      - name: ratchet, no number above the baseline
        id: ratchet
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: python3 tools/ratchet --check
        env:
          RUSTUP_TOOLCHAIN: "1.98.1"

      - name: The gates
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        env:
          GATES: |
            ${{ steps.fmt.outcome }} Rustfmt
            ${{ steps.locks.outcome }} locks: one bsv-rs per committed Cargo.lock
            ${{ steps.grants.outcome }} locks: the reusable CI call's grants
            ${{ steps.clippy.outcome }} Clippy
            ${{ steps.clippy-remote.outcome }} Clippy (remote only)
            ${{ steps.ratchet.outcome }} ratchet
        run: |
          printf '| gate | outcome |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          while read -r outcome gate; do
            [ -n "$gate" ] || continue
            echo "${gate}: ${outcome}"
            printf '| %s | %s |\n' "$gate" "$outcome" >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" != "success" ]; then
              echo "::error title=lint: ${gate}::the ${gate} gate is ${outcome}"
            fi
          done <<< "$GATES"

  # The small checks in one job (#617), as the lint job does with the static
  # gates: the north-star scoreboard, the affected-tests map's cases (#618),
  # the docs-only set's cases (#632),
  # the vectors, the golden fixtures and the documentation build, each its own step run whether or not one before it
  # failed, the last step naming every gate's outcome. The vectors and the
  # fixtures build the same `sqlite` test set, so they compile it once.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      # Two commits deep, as the Test Suite's checkout: the docs-only step's diff.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # As the Test Suite's step: the docs-only short-circuit (#632).
      - name: Docs only
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: python3 tools/docs-only --event "$EVENT" ${BASE:+--base "$BASE"}

      - name: Install Rust
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      # This library currently ignores Cargo.lock. Honor a committed lock
      # when present; otherwise resolve once before the cache, so the cache key
      # hashes the lock this build uses, and before the fixtures' locked replay.
      - name: Prepare dependency lock
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: |
          if ! test -f Cargo.lock; then
            cargo generate-lockfile
          fi

      # As the Test Suite's cache, keyed for this job's `sqlite` builds (the
      # vectors' and fixtures' test builds and the documentation).
      - name: Cache the dependency build
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks
          save-if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

      # The north-star table (docs/NORTH-STAR.md) against its sources and its
      # checksum: an edited table or a stale source value fails. Read-only; the
      # producers (#54's bench job, #55's ratchet) run the write.
      - name: scoreboard, the writer's own cases
        id: scoreboard-cases
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: bash tools/scoreboard-write-test

      - name: scoreboard, the table matches its sources
        id: scoreboard
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: python3 tools/scoreboard-write --check

      # The affected-tests map's cases (#618): the classes, the #[path] and
      # tree-reading targets, every target under tests/ reached by its own
      # file. The Test Suite jobs run the map; this gate checks it.
      - name: affected tests, the map's own cases
        id: affected-cases
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: python3 tools/affected-tests-test

      # The docs-only set's cases (#632): the path classes, the events, and the
      # diff on scratch commits. Every job's opening step runs the script; this
      # gate checks it.
      - name: docs only, the set's own cases
        id: docs-only-cases
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: python3 tools/docs-only-test

      # HANDOFF.md's landing rows (#669): a file per PR under docs/handoff/,
      # the Next section generated from them. A row on the page that differs
      # from its file, has none, or stands out of order fails; a file not yet
      # on the page waits for the captain's fold.
      - name: handoff rows, the tool's own cases
        id: handoff-cases
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: python3 tools/handoff-rows-test

      - name: handoff rows, the page matches its files
        id: handoff
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: python3 tools/handoff-rows --check

      # The vector-backed tests: the Arcade status vector
      # (tests/vectors/arcade_status_verdicts.json) through its three surfaces and
      # the push, the same vector's word table in the library, the six rows of the
      # broadcast-body replay (tests/vectors/broadcast_body/) through the ARC
      # provider, and the cross-SDK vectors of test_vectors/.
      - name: vectors, the vector files are present
        id: vector-files
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: |
          test -s tests/vectors/arcade_status_verdicts.json
          test -s test_vectors/keys/brc29.json
          for r in example_atomic_payment example small_chain_atomic_true small_chain_true lone_atomic lone; do
            test -s "tests/vectors/broadcast_body/$r.bin"
          done

      - name: vectors, the Arcade status vector, the broadcast-body rows and the cross-SDK vectors
        id: vectors
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: cargo test --features sqlite --test arcade_status_vector_tests --test arc_broadcast_body_tests --test test_vectors --verbose

      # A filter that matches nothing passes; the grep refuses a renamed test.
      - name: vectors, the vector's word table in the library
        id: word-table
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: |
          set -o pipefail
          cargo test --features sqlite --lib services::providers::arcade::tests::every_arcade_word_has_the_verdict_of_its_class -- --exact | tee "$RUNNER_TEMP/word-table.log"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/word-table.log"

      - name: fixtures, replay the golden fixtures
        id: fixtures
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: cargo test --test fixtures --locked

      - name: Documentation
        id: docs
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        run: cargo doc --no-deps --features sqlite
        env:
          RUSTDOCFLAGS: -Dwarnings

      - name: The gates
        if: ${{ !cancelled() && steps.scope.outputs.docs_only != 'true' }}
        env:
          GATES: |
            ${{ steps.scoreboard-cases.outcome }} scoreboard: the writer's own cases
            ${{ steps.scoreboard.outcome }} scoreboard: the table matches its sources
            ${{ steps.affected-cases.outcome }} affected tests: the map's own cases
            ${{ steps.docs-only-cases.outcome }} docs only: the set's own cases
            ${{ steps.handoff-cases.outcome }} handoff rows: the tool's own cases
            ${{ steps.handoff.outcome }} handoff rows: the page matches its files
            ${{ steps.vector-files.outcome }} vectors: the vector files are present
            ${{ steps.vectors.outcome }} vectors: the vector tests
            ${{ steps.word-table.outcome }} vectors: the word table
            ${{ steps.fixtures.outcome }} fixtures
            ${{ steps.docs.outcome }} Documentation
        run: |
          printf '| gate | outcome |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          while read -r outcome gate; do
            [ -n "$gate" ] || continue
            echo "${gate}: ${outcome}"
            printf '| %s | %s |\n' "$gate" "$outcome" >> "$GITHUB_STEP_SUMMARY"
            if [ "$outcome" != "success" ]; then
              echo "::error title=checks: ${gate}::the ${gate} gate is ${outcome}"
            fi
          done <<< "$GATES"

  # The public API against the last release tag before this commit. The release
  # type is the one the version names: a Cargo.toml minor (0.x) or major above
  # the baseline's is the breaking release itself (the bump PR is the owner's
  # word), so it is checked as a major; otherwise the check is a minor one and
  # only the owner's api-break PR label permits a reported break. Required on
  # beta; main gains the job when beta merges into it. Never runs on a tag, so
  # it gates no publish.
  semver:
    name: semver
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    # The pull request and merge-queue paths read the PR's labels and the push
    # path asks GitHub which merged PRs carried api-break; the workflow's permissions
    # are contents: read, so the job names the one extra read it needs.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # As the Test Suite's step: the docs-only short-circuit (#632).
      - name: Docs only
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha }}
        run: python3 tools/docs-only --event "$EVENT" ${BASE:+--base "$BASE"}

      - name: Install Rust
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      # Cargo.lock is not tracked (a library): resolve it before the cache, so
      # the cache key hashes the lock this build uses, not the manifest alone.
      - name: Resolve the dependency lock
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: test -f Cargo.lock || cargo generate-lockfile

      # As the Test Suite's cache, keyed for this job's rustdoc JSON builds of
      # the tree and its baseline (#617, off actions/cache).
      - name: Cache the dependency build
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: semver
          save-if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Install cargo-semver-checks
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-semver-checks

      # The baseline: on a pull request, the base branch's tip, so the check
      # reads the PR's own breaks alone (a PR rebased onto a line that already
      # carries owner-worded breaks since its last tag is not red for them);
      # on a merge-queue group, the group's parent commit (merge_group.base_sha:
      # beta's tip, or the head of the group queued ahead), so the check reads
      # the queued PR's own commits alone, rebased as the queue will land them,
      # with that PR's label read live; its number is the one the group's head
      # ref names (refs/heads/gh-readonly-queue/beta/pr-<n>-<sha>), the PR the
      # queue built this group for (#614);
      # on a push, HEAD^'s last tag, never a tag on the commit itself, so the
      # line's whole distance from its last release is read. The api-break
      # switch: on a pull request, the PR's own label, read live from the API
      # rather than the event payload, so a re-run after the label is added
      # sees it (a re-run replays the old payload); on a push, whether any
      # PR merged into this branch since the baseline tag carried the label,
      # because a line collects its owner-worded breaks until its next tag
      # (the pin PR #391 landed with the label and the push run read none; the
      # next PR rebased onto it went red on the pin's breaks).
      - name: Check the public API against its baseline (a PR or a queue group against its base, a push against the last release)
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GROUP_HEAD: ${{ github.event.merge_group.head_ref }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_BREAK=false
          if [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            # refs/heads/gh-readonly-queue/<base>/pr-<n>-<sha>: the number
            # between `pr-` and the next `-`. A head ref of another shape, or
            # a parent commit not fetchable, stops the step: a group is never
            # judged without its PR's label or against another baseline.
            PR_NUMBER="${GROUP_HEAD##*/pr-}"
            PR_NUMBER="${PR_NUMBER%%-*}"
            case "$PR_NUMBER" in
              ''|*[!0-9]*)
                echo "::error title=semver merge group::no PR number in the group's head ref (${GROUP_HEAD:-empty})"
                exit 1;;
            esac
            if [ -z "$GROUP_BASE" ] || ! git fetch -q --no-tags origin "$GROUP_BASE"; then
              echo "::error title=semver merge group::the group's parent commit (${GROUP_BASE:-empty}) is not fetchable"
              exit 1
            fi
            API_BREAK="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels \
              --jq '[.labels[].name] | index("api-break") != null')"
            echo "merge group ${GROUP_HEAD} for pull request #${PR_NUMBER}: api-break label ${API_BREAK} (read live), baseline the group's parent ${GROUP_BASE}" | tee -a "$GITHUB_STEP_SUMMARY"
            base="$GROUP_BASE"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # Captured before use so a refused or faulted read stops the step
            # under set -e instead of reading as no label.
            API_BREAK="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels \
              --jq '[.labels[].name] | index("api-break") != null')"
            echo "pull request #${PR_NUMBER}: api-break label ${API_BREAK} (read live)" | tee -a "$GITHUB_STEP_SUMMARY"
            git fetch -q origin "${GITHUB_BASE_REF}"
            base="origin/${GITHUB_BASE_REF}"
          else
            # No release tag reachable from HEAD^ in a full clone is a line
            # without releases: the baseline is none and the check reads
            # nothing. In a shallow clone it is a fetch shape and stays red
            # (#489, bsv-rs #517's lesson).
            base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ || true)"
            if [ -z "$base" ]; then
              shallow="$(git rev-parse --is-shallow-repository)"
              if [ "$shallow" != "false" ]; then
                echo "::error title=semver baseline::no release tag reachable from HEAD^ in a shallow clone (is-shallow-repository: ${shallow}); the baseline needs the full history"
                exit 1
              fi
              echo "baseline none: no release tag reachable from HEAD^ on ${GITHUB_REF_NAME}; the public API check reads nothing" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            since="$(git log -1 --format=%cI "$base")"
            branch="${GITHUB_REF_NAME}"
            # The PRs merged at or after the tagged commit's date, minus those
            # whose merge commit is an ancestor of the tag (the PR that landed
            # the tagged commit itself merges a second after its commit date).
            # The reads are captured before the loop so a refused or faulted
            # call stops the step under set -e instead of reading as a clean
            # zero. The pushed commit's own PRs come from the commits API too,
            # which is not search-backed, so the labelled PR's own push run is
            # not red while the search index lags.
            searched="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base "$branch" --label api-break \
              --search "merged:>=${since}" --json number,mergeCommit --jq '.[] | "\(.number) \(.mergeCommit.oid)"')"
            own="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[] | select(.merged_at != null) | select([.labels[].name] | index("api-break")) | "\(.number) \(.merge_commit_sha)"')"
            labelled=0; seen=""
            while read -r number oid; do
              [ -n "$oid" ] || continue
              case " $seen " in *" $number "*) continue;; esac
              seen="$seen $number"
              if git merge-base --is-ancestor "$oid" "$base" 2>/dev/null; then continue; fi
              labelled=$((labelled + 1))
            done <<< "$(printf '%s\n%s\n' "$searched" "$own")"
            if [ "$labelled" -gt 0 ]; then API_BREAK=true; fi
            echo "push run: ${labelled} api-break PR(s) merged into ${branch} after ${base} (${since})" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bsv-wallet-toolbox-rs") | .version')"
          # The release type the version names: minor or major above the baseline's
          # (0.x: the minor is the breaking release) is a major check; the same
          # line is a minor check. A prerelease suffix is not part of the comparison.
          # A tag names its version; a branch tip or a group's parent is read.
          base_version="$base"
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            base_version="$(git show "$base:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          fi
          release_type="$(python3 - "$base_version" "$version" <<'EOP'
          import sys
          def mm(v):
              a = v.lstrip("v").split("-")[0].split(".")
              return (int(a[0]), int(a[1]))
          print("major" if mm(sys.argv[2]) > mm(sys.argv[1]) else "minor")
          EOP
          )"
          echo "baseline ${base}, Cargo.toml ${version}, release type ${release_type}" | tee -a "$GITHUB_STEP_SUMMARY"
          report="$RUNNER_TEMP/semver-checks.log"
          if cargo semver-checks --baseline-rev "$base" --release-type "$release_type" --color never 2>&1 | tee "$report"; then
            exit 0
          else
            status=$?
          fi
          # The breaks as one annotation: %, CR and LF escaped as the runner reads them.
          breaks="$(sed -n '/^--- failure /,$p' "$report" |
            awk '{ gsub(/%/, "%25"); gsub(/\r/, "%0D"); printf "%s%%0A", $0 }')"
          if [ "$API_BREAK" = "true" ] && [ -n "$breaks" ]; then
            echo "::notice title=Owner-approved API break::api-break against ${base}: ${breaks}"
            exit 0
          fi
          exit "$status"

[package]
name = "bsv-wallet-toolbox-rs"
version = "0.14.0-beta.6"
edition = "2021"
authors = ["John Calhoun <dev@calhounjohn.com>"]
description = "Storage and services for BSV wallets - Rust implementation of @bsv/wallet-toolbox"
license = "MIT"
repository = "https://github.com/Calhooon/bsv-wallet-toolbox-rs"
homepage = "https://github.com/Calhooon/bsv-wallet-toolbox-rs"
keywords = ["bitcoin", "bsv", "wallet", "blockchain"]
categories = ["cryptography::cryptocurrencies"]

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
# `mysql` requires `sqlite` (#684): it enables sqlx's MySQL driver alone, and
# `StorageSqlx` is SQLite-typed throughout (`Pool<Sqlite>`, `SqliteConnection`,
# `BEGIN IMMEDIATE`); no MySQL store exists, so `mysql` without `sqlite` did
# not compile (40 errors, every one a SQLite type or the SQLite error path).
mysql = ["sqlite", "sqlx/mysql"]
remote = []  # StorageClient for storage.babbage.systems
full = ["sqlite", "mysql", "remote"]
# Break-glass, off by default and not part of `full`: the script hash history
# of WhatsOnChain and Bitails ("every transaction that touched this script").
# It is a chain scan. A wallet learns of an output by being handed a BEEF, so
# nothing in this crate calls it; it is for an operator looking for a payment
# nobody handed over.
break-glass-script-history = []
# Off by default and not part of `full`: the hidden `benchmark_support` seams
# the door Criterion bench drives (`cargo bench --bench door --features
# bench-support`). No default or `full` build compiles them.
bench-support = ["sqlite"]
a8-beef-bytes = []

[dependencies]
# BSV SDK - provides primitives, transactions, wallet traits
bsv-rs = { version = "=0.9.0-beta.6", features = ["full", "http"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# SQL database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "chrono", "uuid"] }

# HTTP client ("stream" for the Arcade V2 SSE status client)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

# Error handling
thiserror = "1.0"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUIDs for references
uuid = { version = "1", features = ["v4", "serde"] }

# Logging/tracing
tracing = "0.1"

# Async traits
async-trait = "0.1"

# Hex encoding (hashing is bsv-rs's: sha256, sha256d, hash160)
hex = "0.4"

# Random generation
rand = "0.8"

# Base64 encoding
base64 = "0.22"

# Lazy static initialization
once_cell = "1.19"
regex = { version = "1", default-features = false, features = ["std", "unicode-bool", "unicode-perl", "unicode-gencat"] }
unicode-normalization = "0.1"

# Cryptography for PBKDF2 (CWI manager)
ring = "0.17"

# Argon2id (version 0x13), the reference's password KDF for UMP tokens (#593);
# no default features: the caller's memory, zeroed by the caller
argon2 = { version = "=0.5.3", default-features = false, features = ["zeroize"] }

# Zeroization of sensitive key material on drop
zeroize = "1.8"

futures = "0.3"

[dev-dependencies]
# The storage fixtures' error type (tests/fixtures); the library names none.
anyhow = "1.0"
tempfile = "3"
mockito = "1.4"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# A UMP token's argon2id at the reference's default (128 MiB, 7 passes) takes
# tens of seconds unoptimised; the tests derive it.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The A8 census tests read 1, 4 and 10 MB BEEFs on both paths (#652). The
# read hashes every transaction it carries: sha2 held 70 to 90% of a census
# test's busy samples unoptimised. The tests then compare the stored rows in
# hex: hex held a quarter of what remained.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hex]
opt-level = 3

[[bench]]
name = "door"
harness = false
required-features = ["bench-support"]

[[example]]
name = "basic_wallet"
path = "examples/basic_wallet.rs"

[[example]]
name = "monitor_demo"
path = "examples/monitor_demo.rs"

[[example]]
name = "a8_census"
path = "examples/a8_census.rs"
required-features = ["sqlite"]

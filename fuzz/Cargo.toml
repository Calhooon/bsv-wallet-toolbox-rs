[package]
name = "bsv-wallet-toolbox-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bsv-rs = { version = "=0.9.0-beta.5", features = ["full", "http"] }
tokio = { version = "1", features = ["rt", "time"] }
serde_json = "1"
hex = "0.4"
chrono = "0.4"

[dependencies.bsv-wallet-toolbox-rs]
path = ".."
features = ["bench-support"]

# Kept out of the root crate's workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "beef_door"
path = "fuzz_targets/beef_door.rs"
test = false
doc = false
bench = false

